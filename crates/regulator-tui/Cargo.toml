[package]
name = "regulator-tui"
description = "Experimental terminal UI for the regulator watch timing machine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "regulator"
path = "src/main.rs"

[features]
default = ["audio"]
# Live microphone capture via cpal. Requires ALSA/WinAudio/CoreAudio at build
# time; disable with --no-default-features to build everywhere else.
audio = ["dep:cpal"]

[dependencies]
regulator-core = { path = "../regulator-core" }
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
cpal = { version = "0.15", optional = true }
